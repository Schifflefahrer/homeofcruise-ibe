<!doctype html>
<html lang="de">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Home of Cruise – Kreuzfahrten buchen</title>

    <!-- COMPASS -->
    <!-- ibe::head -->

    <link
        rel="stylesheet"
        href="https://schifflefahrer.github.io/homeofcruise-ibe/style.css?v=38"
    >
</head>

<body>


    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header class="hoc-header">

        <div class="hoc-header-inner">


            <!-- Logo -->

            <a
                href="https://www.homeofcruise.de/"
                target="_top"
                class="hoc-logo-link"
                aria-label="Zur Home of Cruise Startseite"
            >
                <img
                    src="https://schifflefahrer.github.io/homeofcruise-ibe/images/head1-logo.PNG"
                    alt="Home of Cruise"
                    class="hoc-header-logo"
                >
            </a>


            <!-- Kontakt -->

            <div class="hoc-header-contact">


                <!-- WhatsApp -->

                <a
                    href="https://wa.me/4915567639507"
                    target="_blank"
                    rel="noopener"
                    class="hoc-contact-card hoc-whatsapp"
                    aria-label="WhatsApp Beratung starten"
                >

                    <img
                        src="https://schifflefahrer.github.io/homeofcruise-ibe/images/Digital_Stacked_Green_RGB_2026.png"
                        alt="WhatsApp"
                        class="hoc-whatsapp-logo"
                    >

                    <span class="hoc-contact-text hoc-whatsapp-text">

                        <strong>
                            Beratung starten
                        </strong>

                        <small>
                            Wir sind für dich da
                        </small>

                    </span>

                </a>


                <span class="hoc-header-divider"></span>


                <!-- Telefon -->

                <a
                    href="tel:+4915567639507"
                    class="hoc-contact-card hoc-phone"
                >

                    <span class="hoc-contact-icon">
                        ☎
                    </span>

                    <span class="hoc-contact-text">

                        <strong>
                            (+49) 015567639507
                        </strong>

                        <small>
                            Jetzt anrufen
                        </small>

                    </span>

                </a>


                <!-- Startseite -->

                <a
                    href="https://www.homeofcruise.de/"
                    target="_top"
                    class="hoc-home-button"
                >

                    <span class="hoc-home-icon">
                        ⌂
                    </span>

                    <span>
                        Startseite
                    </span>

                </a>


            </div>

        </div>

    </header>



    <!-- =====================================================
         COMPASS IBE
         ===================================================== -->

    <main class="ibe-page">

        <!-- ibe::body -->

    </main>



    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <footer class="hoc-footer">

        <div class="hoc-footer-inner">


            <!-- Footer Logo -->

            <div class="hoc-footer-brand">

                <a
                    href="https://www.homeofcruise.de/"
                    target="_top"
                    aria-label="Zur Home of Cruise Startseite"
                >
                    <img
                        src="https://schifflefahrer.github.io/homeofcruise-ibe/images/logo-footer.png"
                        alt="Home of Cruise"
                        class="hoc-footer-logo"
                    >
                </a>

            </div>


            <!-- Kontakt -->

            <div class="hoc-footer-contact">

                <a href="tel:+4915567639507">
                    <span>☎</span>
                    <span>(+49) 015567639507</span>
                </a>

                <span class="hoc-footer-divider"></span>

                <a href="mailto:info@schifflefahrer.de">
                    <span>✉</span>
                    <span>info@schifflefahrer.de</span>
                </a>

                <span class="hoc-footer-divider"></span>

                <a
                    href="https://wa.me/4915567639507"
                    target="_blank"
                    rel="noopener"
                >
                    <span>◉</span>
                    <span>WhatsApp schreiben</span>
                </a>

            </div>


            <div class="hoc-footer-line"></div>


            <!-- Rechtliches -->

            <div class="hoc-footer-legal">

                <a
                    href="https://www.homeofcruise.de/impressum"
                    target="_top"
                >
                    Impressum
                </a>

                <span></span>

                <a
                    href="https://www.homeofcruise.de/datenschutz"
                    target="_top"
                >
                    Datenschutz
                </a>

                <span></span>

                <a
                    href="https://www.homeofcruise.de/agb"
                    target="_top"
                >
                    AGB
                </a>

            </div>


        </div>

    </footer>



    <!-- Dynamische Wix-Höhe -->

    <script
        src="https://schifflefahrer.github.io/homeofcruise-ibe/wix-resize.js?v=6">
